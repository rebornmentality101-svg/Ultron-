name: Make Shorts clips

on:
  workflow_dispatch:

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make clips
        run: |
          VIDEO=$(ls *.mp4 | head -n 1)
          echo "Using $VIDEO"
          python main.py "$VIDEO"

      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/
