name: Make Shorts clips

on:
  workflow_dispatch:

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make clips
        run: |
          echo "Files I can see:"
          ls -la
          VIDEO=$(find . -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.mkv" \) | head -n 1)
          echo "Using: $VIDEO"
          if [ -z "$VIDEO" ]; then
            echo "No video found"
            exit 1
          fi
          python main.py "$VIDEO"

      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/
